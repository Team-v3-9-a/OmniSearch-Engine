openapi: 3.0.3
info:
  title: OmniSearch Engine API
  description: |
    REST API контракты для системы мультимодального поиска по видео.
    Определяет публичные эндпоинты (Ingestion, Retrieval, Video Management)
    и внутреннее взаимодействие между микросервисами (Internal).
  version: 0.3.0

servers:
- url: /api/v1
  description: Основной префикс для внешних эндпоинтов

tags:
- name: Ingestion
  description: Загрузка видеофайлов
- name: Retrieval
  description: Поиск по векторизованной базе знаний
- name: Video Management
  description: CRUD-операции с видео
- name: Internal
  description: Взаимодействие между микросервисами (Video Engine ↔ Backend ↔ ML Engine)

paths:
  # ───────────────────────────────────────────────
  #  PUBLIC API
  # ───────────────────────────────────────────────

  /videos/upload:
    post:
      tags: [Ingestion]
      summary: Загрузка видеофайла
      description: |
        Принимает видеофайл, сохраняет в S3, создает запись в БД и запускает
        асинхронный пайплайн обработки (Video Engine → ML Engine).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadBody"
      responses:
        "202":
          description: Файл принят, обработка запущена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Некорректный запрос (отсутствует файл, неверный формат).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /videos/search:
    get:
      tags: [Retrieval]
      summary: Семантический поиск по видео
      description: |
        Проксирует запрос в ML Engine (E5 + CLIP text embeddings),
        выполняет RRF-ранкинг хитов из audio и frames коллекций Qdrant,
        обогащает результаты метаданными из PostgreSQL и presigned URL для thumbnails.
      parameters:
      - name: query
        in: query
        required: true
        description: Текстовый поисковый запрос на естественном языке.
        schema:
          type: string
          minLength: 2
      responses:
        "200":
          description: Массив релевантных видео, отсортированных по score.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResultItem"
        "400":
          description: Пустой или слишком короткий запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: ML Engine недоступен.

  /videos:
    get:
      tags: [Video Management]
      summary: Список всех видео
      description: Возвращает массив всех загруженных видео, отсортированных по дате создания (DESC).
      responses:
        "200":
          description: Массив видео.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoResponseDTO"

  /videos/{id}:
    get:
      tags: [Video Management]
      summary: Получение видео по ID
      description: Возвращает метаданные и текущий статус конкретного видео.
      parameters:
      - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Метаданные видео.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoResponseDTO"
        "404":
          description: Видео не найдено.

  /videos/{id}/stream:
    get:
      tags: [Video Management]
      summary: Получение presigned URL для стриминга
      description: |
        Генерирует MinIO presigned URL для воспроизведения видео в браузере.
        URL валиден в течение 1 часа.
      parameters:
      - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Presigned URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamUrlResponse"
        "404":
          description: Видео не найдено.

    delete:
      tags: [Video Management]
      summary: Удаление видео
      description: |
        Каскадное удаление видео: запись из PostgreSQL, объекты из MinIO
        (исходное видео + media/{id}/*), векторы из Qdrant (через ML Engine).
      parameters:
      - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: Видео успешно удалено.
        "404":
          description: Видео с таким ID не найдено.

  # ───────────────────────────────────────────────
  #  INTERNAL API
  # ───────────────────────────────────────────────

  /internal/videos/{id}:
    patch:
      tags: [Internal]
      summary: Обновление статуса/метаданных видео
      description: |
        Вызывается Video Engine и ML Engine для обновления статуса видео.
        Video Engine: PROCESSING_MEDIA → PROCESSING_ML (с metadata).
        ML Engine: PROCESSING_ML → READY или ERROR.
      parameters:
      - $ref: "#/components/parameters/VideoId"
      - $ref: "#/components/parameters/InternalSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoRequest"
      responses:
        "200":
          description: Статус обновлен.
        "400":
          description: Некорректные параметры.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Неверный X-Internal-Secret.

  # ───────────────────────────────────────────────
  #  INTER-SERVICE: Video Engine
  # ───────────────────────────────────────────────

  http://video-engine:8081/process:
    post:
      tags: [Internal]
      summary: Запуск обработки видео (Backend → Video Engine)
      description: Начинает нарезку кадров и извлечение аудио из видео.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoProcessRequest"
      responses:
        "202":
          description: Принято в обработку.
        "400":
          description: Ошибка в теле запроса.

  http://video-engine:8081/health:
    get:
      tags: [Internal]
      summary: Health check Video Engine
      responses:
        "200":
          description: Сервис работает.

  # ───────────────────────────────────────────────
  #  INTER-SERVICE: ML Engine
  # ───────────────────────────────────────────────

  http://ml-engine:8000/api/v1/process:
    post:
      tags: [Internal]
      summary: ML-обработка аудио и кадров (Video Engine → ML Engine)
      description: |
        Скачивает аудио и кадры из S3, выполняет:
        1) Whisper транскрибация → текстовые эмбеддинги (E5) → upsert в audio_collection
        2) CLIP Vision эмбеддинги кадров → upsert в frames_collection
        По завершении отправляет callback READY/ERROR к Backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioProcessRequest"
      responses:
        "202":
          description: Задание на обработку создано.

  http://ml-engine:8000/api/v1/search:
    post:
      tags: [Internal]
      summary: Гибридный векторный поиск (Backend → ML Engine)
      description: |
        Параллельно выполняет:
        1) E5 text embedding → поиск по audio_collection
        2) CLIP text embedding → поиск по frames_collection
        Результаты сливаются через RRF (Reciprocal Rank Fusion).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MLSearchRequest"
      responses:
        "200":
          description: Ранкированные результаты.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MLSearchResponse"

  http://ml-engine:8000/health:
    get:
      tags: [Internal]
      summary: Health check ML Engine
      responses:
        "200":
          description: '{"status": "ready"}'

# ═══════════════════════════════════════════════
#  COMPONENTS
# ═══════════════════════════════════════════════

components:
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      description: UUID видеоролика.
      schema:
        type: string
        format: uuid

    InternalSecret:
      name: X-Internal-Secret
      in: header
      required: true
      description: Секретный токен для внутреннего API.
      schema:
        type: string

  schemas:
    # ── Enums ──
    VideoStatus:
      type: string
      description: Статус видео в пайплайне обработки.
      enum:
        - UPLOADED
        - PROCESSING_MEDIA
        - PROCESSING_ML
        - READY
        - ERROR

    # ── Public API Schemas ──
    UploadBody:
      required: [file]
      type: object
      properties:
        file:
          type: string
          format: binary

    UploadResponse:
      required: [id, message]
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          example: "Video uploaded successfully. Processing started."

    VideoResponseDTO:
      required: [id, title, status, createdAt, updatedAt]
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/VideoStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fps:
          type: number
          format: float
          nullable: true
        resolution:
          type: string
          nullable: true
          example: "1920x1080"

    StreamUrlResponse:
      required: [url]
      type: object
      properties:
        url:
          type: string
          format: uri
          description: MinIO presigned URL, валиден 1 час.

    SearchResultItem:
      required: [video_id, title, score, segments]
      type: object
      properties:
        video_id:
          type: string
          format: uuid
        title:
          type: string
        thumbnail_url:
          type: string
          format: uri
        duration:
          type: integer
          description: Длительность в секундах.
        created_date:
          type: string
          format: date-time
        upload_date:
          type: string
          format: date-time
        score:
          type: number
          format: double
          description: Максимальный RRF score среди сегментов.
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultSegment"

    SearchResultSegment:
      required: [text_snippet, start_time, end_time]
      type: object
      properties:
        text_snippet:
          type: string
          description: Фрагмент транскрибации, соответствующий запросу.
        start_time:
          type: number
          format: double
          description: Начало сегмента в секундах.
        end_time:
          type: number
          format: double
          description: Конец сегмента в секундах.

    # ── Internal API Schemas ──
    UpdateVideoRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/VideoStatus"
        error:
          type: string
          description: Сообщение об ошибке (при status=ERROR).
        durationSeconds:
          type: integer
        thumbnailPath:
          type: string
          description: 'S3 путь к thumbnail. Пример: media/{id}/thumbnail.jpg'
        fps:
          type: number
          format: float
        resolution:
          type: string
          example: "1920x1080"

    # ── Video Engine Schemas ──
    VideoProcessRequest:
      required: [video_id, s3_path]
      type: object
      properties:
        video_id:
          type: string
          format: uuid
        s3_path:
          type: string
          description: 'S3 ключ исходного видео. Пример: videos/filename.mp4'

    # ── ML Engine Schemas ──
    AudioProcessRequest:
      required: [video_id, audio_key, frames_prefix]
      type: object
      properties:
        video_id:
          type: string
          format: uuid
        bucket_name:
          type: string
          default: "videos"
        audio_key:
          type: string
          description: 'S3 ключ аудио. Пример: media/{id}/audio.wav'
        frames_prefix:
          type: string
          description: 'S3 префикс кадров. Пример: media/{id}/frames/'

    MLSearchRequest:
      required: [query]
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5

    MLSearchResponse:
      required: [results]
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MLSearchResultItem"

    MLSearchResultItem:
      required: [video_id, score]
      type: object
      properties:
        video_id:
          type: string
          format: uuid
        score:
          type: number
          format: double
        start_time:
          type: number
          format: double
          nullable: true
        end_time:
          type: number
          format: double
          nullable: true
        text_snippet:
          type: string
          nullable: true
        source:
          type: string
          enum: [audio, frames, both]
          default: audio

    ErrorResponse:
      required: [error_code, message]
      type: object
      properties:
        error_code:
          type: integer
        message:
          type: string
